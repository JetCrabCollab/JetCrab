name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          REPO_NAME=$(basename "$GITHUB_WORKSPACE")
          cd ..
          printf '[workspace]\nresolver = "2"\nmembers = ["chitin", "%s"]\n\n[workspace.package]\nversion = "0.1.0"\nedition = "2021"\nauthors = ["JetCrab Team"]\nlicense = "MIT"\n' "$REPO_NAME" > Cargo.toml
          git clone --depth 1 https://github.com/JetCrabCollab/chitin.git chitin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ github.workspace }}/.."

      - name: Run tests
        working-directory: ${{ github.workspace }}/..
        run: cargo test -p jetcrab --verbose

      - name: Run clippy
        working-directory: ${{ github.workspace }}/..
        run: cargo clippy -p jetcrab --all-targets --all-features -- -D warnings

      - name: Check formatting
        working-directory: ${{ github.workspace }}/..
        run: cargo fmt -- --check

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          REPO_NAME=$(basename "$GITHUB_WORKSPACE")
          cd ..
          printf '[workspace]\nresolver = "2"\nmembers = ["chitin", "%s"]\n\n[workspace.package]\nversion = "0.1.0"\nedition = "2021"\nauthors = ["JetCrab Team"]\nlicense = "MIT"\n' "$REPO_NAME" > Cargo.toml
          git clone --depth 1 https://github.com/JetCrabCollab/chitin.git chitin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ github.workspace }}/.."

      - name: Build
        working-directory: ${{ github.workspace }}/..
        run: cargo build -p jetcrab --release

      - name: Test binary
        working-directory: ${{ github.workspace }}/..
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/release/jetcrab.exe --version
          else
            ./target/release/jetcrab --version
          fi

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          REPO_NAME=$(basename "$GITHUB_WORKSPACE")
          cd ..
          printf '[workspace]\nresolver = "2"\nmembers = ["chitin", "%s"]\n\n[workspace.package]\nversion = "0.1.0"\nedition = "2021"\nauthors = ["JetCrab Team"]\nlicense = "MIT"\n' "$REPO_NAME" > Cargo.toml
          git clone --depth 1 https://github.com/JetCrabCollab/chitin.git chitin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: ${{ github.workspace }}/..
        run: cargo audit
