[package]
name = "jetcrab"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["JetCrab Team"]
description = "A modern JavaScript engine written in Rust"
repository = "https://github.com/JetCrabCollab/JetCrab"
keywords = ["javascript", "engine", "vm", "compiler"]
categories = ["development-tools"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "basic_benchmark"
harness = false

[[bench]]
name = "lexer_benchmarks"
harness = false

[[bench]]
name = "parser_benchmarks"
harness = false

[[bench]]
name = "vm_benchmarks"
harness = false

[[bench]]
name = "performance_benchmarks"
harness = false

[[bench]]
name = "simple_benchmark"
harness = false

[[bench]]
name = "test_benchmark"
harness = false

[[bench]]
name = "minimal_benchmark"
harness = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
