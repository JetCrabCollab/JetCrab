[package]
name = "jetcrab"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["JetCrab Team"]
description = "A modern JavaScript engine written in Rust"
repository = "https://github.com/JetCrabCollab/JetCrab"
keywords = ["javascript", "engine", "vm", "compiler"]
categories = ["development-tools"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

# Integration Tests
[[test]]
name = "basic_tests"
path = "tests/integration/basic_tests.rs"

[[test]]
name = "advanced_tests"
path = "tests/integration/advanced_tests.rs"

[[test]]
name = "e2e_tests"
path = "tests/integration/e2e_tests.rs"

