[package]
name = "hello-world-jetcrab"
version = "0.4.0"
edition = "2021"
authors = ["JetCrab Team"]
description = "A simple Hello World example for JetCrab runtime"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
jetcrab = { path = "../../" }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

