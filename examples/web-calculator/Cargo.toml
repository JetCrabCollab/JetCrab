[package]
name = "web-calculator-jetcrab"
version = "0.4.0"
edition = "2021"
authors = ["JetCrab Team"]
description = "A modern web calculator built with JetCrab runtime"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
jetcrab = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "EventTarget",
  "MessageEvent",
  "WebSocket",
]

